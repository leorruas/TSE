name: Atualizar dados do TSE

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/sync.yml"

permissions:
  contents: write

concurrency:
  group: tse-live-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sincronizar apuração a cada minuto
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p data
          base="https://resultados.tse.jus.br/oficial/ele2026"

          sync_once() {
            echo "Sincronizando em $(date -u +%Y-%m-%dT%H:%M:%SZ)"

            # Parte sempre do main mais recente para evitar conflito com
            # alterações na página enquanto a apuração está rodando.
            git fetch origin main
            git reset --hard origin/main

            curl -fsSL --retry 3 "$base/6257/dados/br/br-c0001-e006257-u.json" -o data/presidente.json
            curl -fsSL --retry 3 "$base/6259/dados/mg/mg-c0003-e006259-u.json" -o data/governador-mg.json
            curl -fsSL --retry 3 "$base/6259/dados/mg/mg-c0005-e006259-u.json" -o data/senador-mg.json
            curl -fsSL --retry 3 "$base/6259/dados/mg/mg-c0006-e006259-u.json" -o data/deputado-federal-mg.json
            curl -fsSL --retry 3 "$base/6259/dados/mg/mg-c0007-e006259-u.json" -o data/deputado-estadual-mg.json

            mkdir -p data/presidente-estados
            for uf in ac al ap am ba ce df es go ma mt ms mg pa pb pr pe pi rj rn rs ro rr sc sp se to; do
              curl -fsSL --retry 3 "$base/6257/dados/$uf/$uf-c0001-e006257-u.json" -o "data/presidente-estados/$uf.json"
            done

            jq -s '
              map({
                uf: (.cdabr | ascii_upcase),
                total_secoes: (.s.ts|tonumber),
                secoes_totalizadas: (.s.st|tonumber),
                percentual_totalizado: .s.pst,
                candidatos: ([.carg[].agr[].par[].cand[] |
                  {
                    numero: .n,
                    nome: .nmu,
                    votos: (.vap|tonumber),
                    percentual: (.pvap|tonumber)
                  }
                ] | sort_by(.votos) | reverse)
              })
              | sort_by(.uf)
            ' data/presidente-estados/{ac,al,ap,am,ba,ce,df,es,go,ma,mt,ms,mg,pa,pb,pr,pe,pi,rj,rn,rs,ro,rr,sc,sp,se,to}.json > data/presidente-estados.json

            mkdir -p data/senadores
            for uf in ac al ap am ba ce df es go ma mt ms mg pa pb pr pe pi rj rn rs ro rr sc sp se to; do
              curl -fsSL --retry 3 "$base/6259/dados/$uf/$uf-c0005-e006259-u.json" -o "data/senadores/$uf.json"
            done

            printf '{"updated_at":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > data/meta.json

            git add data
            if git diff --cached --quiet; then
              echo "Sem mudanças."
            else
              git commit -m "Atualiza apuração"
              git push origin main
            fi
          }

          is_complete() {
            local pending=0

            for file in data/presidente.json data/governador-mg.json data/senador-mg.json data/deputado-federal-mg.json data/deputado-estadual-mg.json; do
              jq -e '(.s.st|tonumber) >= (.s.ts|tonumber)' "$file" >/dev/null || pending=1
            done

            for file in data/senadores/*.json; do
              jq -e '(.s.st|tonumber) >= (.s.ts|tonumber)' "$file" >/dev/null || pending=1
            done

            [ "$pending" -eq 0 ]
          }

          # Acompanha minuto a minuto até a totalização chegar a 100%.
          # Se o runner atingir o limite desta execução antes disso, o
          # agendamento horário inicia outro e continua de onde parou.
          for i in $(seq 1 300); do
            sync_once

            if is_complete; then
              echo "Apuração acompanhada chegou a 100%. Encerrando sincronização contínua."
              break
            fi

            if [ "$i" -lt 300 ]; then
              sleep 60
            fi
          done
