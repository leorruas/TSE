name: Atualizar dados do TSE

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/sync.yml"

permissions:
  contents: write

concurrency:
  group: tse-live-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sincronizar apuração a cada minuto
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p data
          base="https://resultados.tse.jus.br/oficial/ele2026"

          sync_once() {
            echo "Sincronizando em $(date -u +%Y-%m-%dT%H:%M:%SZ)"

            # Parte sempre do main mais recente para evitar conflito com
            # alterações na página enquanto a apuração está rodando.
            git fetch origin main
            git reset --hard origin/main

            curl -fsSL --retry 3 "$base/6257/dados/br/br-c0001-e006257-u.json" -o data/presidente.json
            curl -fsSL --retry 3 "$base/6259/dados/mg/mg-c0003-e006259-u.json" -o data/governador-mg.json
            curl -fsSL --retry 3 "$base/6259/dados/mg/mg-c0005-e006259-u.json" -o data/senador-mg.json
            curl -fsSL --retry 3 "$base/6259/dados/mg/mg-c0006-e006259-u.json" -o data/deputado-federal-mg.json
            curl -fsSL --retry 3 "$base/6259/dados/mg/mg-c0007-e006259-u.json" -o data/deputado-estadual-mg.json

            mkdir -p data/nordeste
            for uf in al ba ce ma pb pe pi rn se; do
              curl -fsSL --retry 3 "$base/6257/dados/$uf/$uf-c0001-e006257-u.json" -o "data/nordeste/$uf.json"
            done

            mkdir -p data/senadores
            for uf in ac al ap am ba ce df es go ma mt ms mg pa pb pr pe pi rj rn rs ro rr sc sp se to; do
              curl -fsSL --retry 3 "$base/6259/dados/$uf/$uf-c0005-e006259-u.json" -o "data/senadores/$uf.json"
            done

            jq -s '
              {
                updated_at: (now | todate),
                total_secoes: (map(.s.ts|tonumber) | add),
                secoes_totalizadas: (map(.s.st|tonumber) | add),
                percentual_totalizado: (((map(.s.st|tonumber)|add) / (map(.s.ts|tonumber)|add) * 10000 | round) / 100),
                estados: map({
                  uf: .cdabr,
                  total_secoes: (.s.ts|tonumber),
                  secoes_totalizadas: (.s.st|tonumber),
                  percentual_totalizado: .s.pst,
                  data: .dt,
                  hora: .ht
                })
              }
            ' data/nordeste/{al,ba,ce,ma,pb,pe,pi,rn,se}.json > data/nordeste.json

            printf '{"updated_at":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > data/meta.json

            git add data
            if git diff --cached --quiet; then
              echo "Sem mudanças."
            else
              git commit -m "Atualiza apuração"
              git push origin main
            fi
          }

          # Mantém um único runner acompanhando a apuração por cerca de 5 horas.
          # Assim, durante a noite da eleição, não dependemos da pontualidade
          # do scheduler do GitHub para obter atualização minuto a minuto.
          for i in $(seq 1 300); do
            sync_once
            if [ "$i" -lt 300 ]; then
              sleep 60
            fi
          done
